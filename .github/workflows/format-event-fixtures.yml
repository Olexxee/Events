name: Format isolated event fixtures

on:
  push:
    branches:
      - feat/vybe-time-slot-exclusive-holds

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[skip formatter]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vybe-time-slot-exclusive-holds
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund --legacy-peer-deps --ignore-scripts
      - run: npx prettier --write tests/events.integration.test.ts
      - name: Commit formatting
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/events.integration.test.ts
            git commit -m "chore: format isolated event fixtures [skip formatter]"
            git push
          fi
