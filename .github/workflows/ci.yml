name: CI

concurrency:
  group: events-api-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://events:events@localhost:5432/events_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: events
          POSTGRES_PASSWORD: events
          POSTGRES_DB: events_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U events -d events_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11
      - run: npm ci --no-audit --no-fund --legacy-peer-deps --ignore-scripts
      - run: npm rebuild esbuild @prisma/client prisma @prisma/engines
      - name: Validate Prisma schema
        run: npm run prisma:validate
      - run: npm run prisma:generate
      - name: Apply migrations to PostgreSQL
        run: npm run prisma:migrate:deploy
      - run: npm run typecheck
      - run: npm run lint
      - name: Inspect canonical hold formatting
        run: |
          npx prettier --write src/modules/vybe-accommodation/vybe-accommodation.controller.ts src/modules/vybe-accommodation/vybe-accommodation.db.ts src/modules/vybe-accommodation/vybe-accommodation.holds.db.ts tests/vybe-accommodation-supply.integration.test.ts
          git diff -- src/modules/vybe-accommodation/vybe-accommodation.controller.ts src/modules/vybe-accommodation/vybe-accommodation.db.ts src/modules/vybe-accommodation/vybe-accommodation.holds.db.ts tests/vybe-accommodation-supply.integration.test.ts
      - run: npm run format:check
      - run: npm test
      - run: npm run build
