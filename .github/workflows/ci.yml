name: CI

concurrency:
  group: events-api-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11
      - run: npm ci --no-audit --no-fund --legacy-peer-deps --ignore-scripts
      - run: npm rebuild esbuild @prisma/client prisma @prisma/engines
      - name: Validate Prisma schema
        run: npm run prisma:validate
        env:
          DATABASE_URL: postgresql://events:events@localhost:5432/events_ci
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm run lint
      - name: Temporary formatter output
        run: |
          files="src/modules/events/events.controller.ts src/modules/events/events.db.ts src/modules/events/events.routes.ts src/modules/events/events.service.ts src/modules/events/events.validators.ts tests/events-validation.test.ts"
          npx prettier --write $files
          for file in $files; do
            echo "###FORMATTED_FILE:$file"
            cat "$file"
          done
      - run: npm run format:check
      - run: npm test
      - run: npm run build
