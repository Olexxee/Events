name: CI

concurrency:
  group: events-api-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11
      - run: npm ci --no-audit --no-fund --legacy-peer-deps --ignore-scripts
      - run: npm rebuild esbuild @prisma/client prisma @prisma/engines
      - name: Validate Prisma schema
        run: npm run prisma:validate
        env:
          DATABASE_URL: postgresql://events:events@localhost:5432/events_ci
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm run lint
      - name: Diagnose organizer formatting
        run: |
          npx prettier --write src/modules/organizers/organizers.controller.ts src/modules/organizers/organizers.routes.ts
          git diff -- src/modules/organizers/organizers.controller.ts src/modules/organizers/organizers.routes.ts
      - run: npm run format:check
      - run: npm test
      - run: npm run build
