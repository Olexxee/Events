name: CI

concurrency:
  group: events-api-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11
      - run: npm install --no-audit --no-fund --legacy-peer-deps --ignore-scripts
      - run: npm rebuild esbuild @prisma/client prisma @prisma/engines
      - name: Export generated npm lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Commit npm lockfile when dependency resolution changes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const path = "package-lock.json";
            const content = fs.readFileSync(path, "utf8");
            let sha;

            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: "main"
              });

              if (!Array.isArray(data) && data.type === "file") {
                const existing = Buffer.from(data.content, "base64").toString("utf8");
                if (existing === content) {
                  core.info("package-lock.json is already up to date.");
                  return;
                }
                sha = data.sha;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: "build: add reproducible npm lockfile",
              content: Buffer.from(content).toString("base64"),
              branch: "main",
              ...(sha ? { sha } : {})
            });
