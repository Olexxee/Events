name: Format Vybe booking conversion
on:
  push:
    branches:
      - feat/vybe-booking-hold-conversion
    paths:
      - .github/workflows/format-vybe-booking-conversion.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --legacy-peer-deps --ignore-scripts
      - run: npx prisma format
      - run: npx prettier --write README.md docs/VYBE_BOOKING_DESIGN.md docs/VYBE_BOOKING_SCHEMA_REVIEW.md src/modules/vybe-bookings/vybe-bookings.contracts.ts src/modules/vybe-bookings/vybe-bookings.db.ts src/modules/vybe-time-slots/vybe-time-slots.db.ts tests/vybe-inventory.integration.test.ts tests/vybe-time-slots-capacity-holds.integration.test.ts tests/vybe-time-slots-exclusive-holds.integration.test.ts
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/VYBE_BOOKING_DESIGN.md docs/VYBE_BOOKING_SCHEMA_REVIEW.md prisma/schema.prisma src/modules/vybe-bookings/vybe-bookings.contracts.ts src/modules/vybe-bookings/vybe-bookings.db.ts src/modules/vybe-time-slots/vybe-time-slots.db.ts tests/vybe-inventory.integration.test.ts tests/vybe-time-slots-capacity-holds.integration.test.ts tests/vybe-time-slots-exclusive-holds.integration.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style: format Vybe booking conversion"
          git push
