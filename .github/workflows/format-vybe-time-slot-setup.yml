name: Format Vybe time-slot setup

on:
  push:
    branches:
      - feat/vybe-time-slot-provider-setup

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vybe-time-slot-provider-setup
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11
      - run: npm ci --no-audit --no-fund --legacy-peer-deps --ignore-scripts
      - run: npm rebuild esbuild @prisma/client prisma @prisma/engines
      - run: npx prettier --write src/modules/vybe-time-slots/vybe-time-slots.controller.ts src/modules/vybe-time-slots/vybe-time-slots.db.ts src/modules/vybe-time-slots/vybe-time-slots.service.ts tests/vybe-time-slots-provider.integration.test.ts
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/vybe-time-slots/vybe-time-slots.controller.ts src/modules/vybe-time-slots/vybe-time-slots.db.ts src/modules/vybe-time-slots/vybe-time-slots.service.ts tests/vybe-time-slots-provider.integration.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required"
          else
            git commit -m "style(vybe): format time-slot provider setup [skip ci]"
            git push origin HEAD:feat/vybe-time-slot-provider-setup
          fi
