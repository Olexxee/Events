name: Format Vybe time-slot capacity holds

on:
  push:
    branches:
      - feat/vybe-time-slot-capacity-holds

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/vybe-time-slot-capacity-holds
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps --ignore-scripts
      - name: Format targeted files
        run: npx prettier --write src/modules/vybe-time-slots/vybe-time-slots.db.ts tests/vybe-time-slots-capacity-holds.integration.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/vybe-time-slots/vybe-time-slots.db.ts tests/vybe-time-slots-capacity-holds.integration.test.ts
          git commit -m "style(vybe): apply Prettier to capacity hold files"
          git push origin HEAD:feat/vybe-time-slot-capacity-holds
