name: Format Vybe inventory implementation

on:
  push:
    branches:
      - feat/vybe-quantity-inventory-foundation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vybe-quantity-inventory-foundation
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --legacy-peer-deps --ignore-scripts
      - name: Format inventory implementation
        run: npx prettier --write src/app.ts src/modules/vybe-inventory/*.ts tests/vybe-inventory.integration.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.ts src/modules/vybe-inventory/*.ts tests/vybe-inventory.integration.test.ts
          git commit -m "style(vybe): format inventory implementation"
          git push origin HEAD:feat/vybe-quantity-inventory-foundation
