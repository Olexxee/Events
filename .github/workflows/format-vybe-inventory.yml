name: Format Vybe inventory test

on:
  push:
    branches:
      - feat/vybe-quantity-inventory-foundation
    paths:
      - .github/workflows/format-vybe-inventory.yml

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[skip formatter]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vybe-quantity-inventory-foundation
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund --legacy-peer-deps --ignore-scripts
      - run: npx prettier --write tests/vybe-inventory.integration.test.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/vybe-inventory.integration.test.ts
          git commit -m "style(vybe): apply Prettier to inventory integration test [skip formatter]"
          git push
